<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amplitude Value Calculator</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f1629;
      --sf: #1a2340;
      --s2: #243060;
      --bd: #2e3d6e;
      --tx: #e8eaf6;
      --t2: #8892b0;
      --ac: #1677ff;
      --a2: #4facfe;
      --gr: #10b981;
      --rd: #ef4444;
      --yl: #f59e0b;
      --mono: 'SF Mono', 'Fira Code', 'Fira Mono', monospace;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--tx);
      min-height: 100vh;
      font-size: 14px;
      line-height: 1.5;
    }
    #root { min-height: 100vh; }

    /* Header */
    .header {
      height: 56px;
      background: var(--sf);
      border-bottom: 1px solid var(--bd);
      display: flex;
      align-items: center;
      padding: 0 24px;
      gap: 16px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header-logo {
      font-size: 18px;
      font-weight: 700;
      color: var(--ac);
      letter-spacing: -0.3px;
    }
    .header-divider {
      width: 1px;
      height: 20px;
      background: var(--bd);
    }
    .header-subtitle {
      font-size: 13px;
      color: var(--t2);
      font-weight: 500;
    }
    .header-company {
      margin-left: auto;
      font-size: 13px;
      color: var(--a2);
      font-weight: 600;
    }
    .header-logo-img {
      height: 28px;
      object-fit: contain;
    }

    /* Tab nav */
    .tab-nav {
      background: var(--sf);
      border-bottom: 1px solid var(--bd);
      display: flex;
      padding: 0 24px;
      gap: 0;
      overflow-x: auto;
    }
    .tab-btn {
      background: none;
      border: none;
      color: var(--t2);
      padding: 12px 18px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      font-family: inherit;
      border-bottom: 2px solid transparent;
      transition: color 0.15s, border-color 0.15s;
      white-space: nowrap;
    }
    .tab-btn:hover { color: var(--tx); }
    .tab-btn.active { color: var(--ac); border-bottom-color: var(--ac); }

    /* Layout */
    .main {
      max-width: 1400px;
      margin: 0 auto;
      padding: 24px;
    }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* Cards */
    .card {
      background: var(--sf);
      border: 1px solid var(--bd);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 16px;
    }
    .card-sm {
      background: var(--s2);
      border: 1px solid var(--bd);
      border-radius: 6px;
      padding: 14px 16px;
    }

    /* Industry pills */
    .pill-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
    }
    .pill {
      padding: 5px 14px;
      border-radius: 20px;
      border: 1px solid var(--bd);
      background: var(--s2);
      color: var(--t2);
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
      transition: all 0.15s;
      font-family: inherit;
    }
    .pill:hover { border-color: var(--ac); color: var(--tx); }
    .pill.active { background: var(--ac); border-color: var(--ac); color: #fff; }

    /* Form elements */
    .input-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .field-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 0;
    }
    .field-label {
      flex: 1;
      font-size: 12px;
      color: var(--t2);
      min-width: 0;
    }
    .field-label.assumption-label {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .info-btn {
      background: none;
      border: none;
      color: var(--t2);
      cursor: pointer;
      font-size: 11px;
      padding: 0 2px;
      position: relative;
    }
    .info-btn:hover .tooltip { display: block; }
    .tooltip {
      display: none;
      position: absolute;
      bottom: 100%;
      left: 50%;
      transform: translateX(-50%);
      background: #1e2d50;
      border: 1px solid var(--bd);
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 11px;
      color: var(--tx);
      white-space: nowrap;
      max-width: 260px;
      white-space: normal;
      z-index: 200;
      width: 220px;
      line-height: 1.4;
    }
    .field-input-wrap {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .field-prefix {
      font-size: 12px;
      color: var(--t2);
      font-family: var(--mono);
    }
    input[type="number"], input[type="text"] {
      background: var(--s2);
      border: 1px solid var(--bd);
      border-radius: 4px;
      color: var(--tx);
      padding: 4px 8px;
      font-size: 12px;
      font-family: var(--mono);
      width: 100px;
      text-align: right;
      outline: none;
      transition: border-color 0.15s;
    }
    input[type="number"]:focus, input[type="text"]:focus {
      border-color: var(--ac);
    }
    input[type="number"]:disabled, input[type="text"]:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    input.wide { width: 200px; }
    .field-suffix {
      font-size: 11px;
      color: var(--t2);
      min-width: 28px;
    }
    .field-static {
      font-size: 12px;
      color: var(--tx);
      font-family: var(--mono);
      min-width: 100px;
      text-align: right;
    }
    .lock-icon { font-size: 10px; color: var(--yl); }

    /* Use case card */
    .uc-card {
      background: var(--sf);
      border: 1px solid var(--bd);
      border-radius: 8px;
      margin-bottom: 12px;
      overflow: hidden;
      transition: border-color 0.15s;
    }
    .uc-card.disabled { opacity: 0.55; }
    .uc-card:hover { border-color: var(--ac); }
    .uc-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 16px;
      cursor: pointer;
    }
    .uc-toggle {
      width: 16px;
      height: 16px;
      accent-color: var(--ac);
      cursor: pointer;
      flex-shrink: 0;
    }
    .uc-name {
      font-size: 14px;
      font-weight: 600;
      flex: 1;
    }
    .uc-cat {
      font-size: 10px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 10px;
      background: var(--s2);
      color: var(--t2);
      border: 1px solid var(--bd);
    }
    .uc-cat.revenue-growth { background: rgba(16,185,129,0.15); color: var(--gr); border-color: rgba(16,185,129,0.3); }
    .uc-cat.revenue-protection { background: rgba(246,173,63,0.15); color: var(--yl); border-color: rgba(246,173,63,0.3); }
    .uc-cat.cost-savings { background: rgba(99,102,241,0.15); color: #a5b4fc; border-color: rgba(99,102,241,0.3); }
    .sol-chip {
      font-size: 10px;
      padding: 1px 7px;
      border-radius: 8px;
      color: #fff;
      font-weight: 500;
    }
    .uc-body {
      padding: 0 16px 16px;
      border-top: 1px solid var(--bd);
    }

    /* Steps */
    .step-block {
      background: var(--s2);
      border: 1px solid var(--bd);
      border-radius: 6px;
      padding: 12px 14px;
      margin-top: 10px;
    }
    .step-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--t2);
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin-bottom: 8px;
    }
    .step-formula {
      font-size: 11px;
      color: var(--t2);
      font-family: var(--mono);
      margin-top: 6px;
      padding: 4px 8px;
      background: rgba(0,0,0,0.2);
      border-radius: 4px;
    }
    .step-result {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid var(--bd);
    }
    .step-result-label {
      font-size: 12px;
      color: var(--t2);
    }
    .step-result-value {
      font-size: 13px;
      font-weight: 600;
      font-family: var(--mono);
      color: var(--tx);
    }
    .step-final-value {
      font-size: 16px;
      font-weight: 700;
      font-family: var(--mono);
      color: var(--gr);
    }
    .step-npv {
      margin-top: 10px;
      padding: 10px 14px;
      background: rgba(22,119,255,0.1);
      border: 1px solid rgba(22,119,255,0.25);
      border-radius: 6px;
    }
    .step-npv-label {
      font-size: 11px;
      color: var(--a2);
      font-weight: 600;
      margin-bottom: 4px;
    }
    .step-npv-value {
      font-size: 14px;
      font-weight: 700;
      font-family: var(--mono);
      color: var(--a2);
    }

    /* AI layer */
    .ai-section {
      margin-top: 10px;
      border-left: 3px solid var(--ac);
      padding-left: 12px;
    }
    .ai-toggle-row {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      margin-top: 6px;
    }
    .ai-badge {
      font-size: 10px;
      font-weight: 700;
      background: rgba(22,119,255,0.2);
      color: var(--a2);
      border: 1px solid rgba(22,119,255,0.3);
      padding: 1px 7px;
      border-radius: 8px;
    }
    .ai-label {
      font-size: 12px;
      color: var(--a2);
      font-weight: 500;
    }
    .ai-npv {
      font-size: 12px;
      font-family: var(--mono);
      color: var(--a2);
      margin-top: 6px;
    }

    /* Value lens */
    .lens-row {
      display: flex;
      gap: 0;
      margin-bottom: 20px;
    }
    .lens-btn {
      padding: 6px 16px;
      border: 1px solid var(--bd);
      background: var(--s2);
      color: var(--t2);
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
      font-family: inherit;
      transition: all 0.15s;
    }
    .lens-btn:first-child { border-radius: 4px 0 0 4px; }
    .lens-btn:last-child { border-radius: 0 4px 4px 0; }
    .lens-btn:not(:last-child) { border-right: none; }
    .lens-btn.active { background: var(--ac); border-color: var(--ac); color: #fff; }

    /* Top controls */
    .controls-row {
      display: flex;
      align-items: flex-start;
      gap: 16px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .controls-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .controls-label {
      font-size: 11px;
      color: var(--t2);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Summary table */
    .summary-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }
    .summary-table th {
      text-align: left;
      padding: 8px 12px;
      color: var(--t2);
      font-weight: 600;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-bottom: 1px solid var(--bd);
    }
    .summary-table th.right { text-align: right; }
    .summary-table td {
      padding: 8px 12px;
      border-bottom: 1px solid rgba(46,61,110,0.5);
      font-family: var(--mono);
      font-size: 12px;
    }
    .summary-table td.name { font-family: inherit; color: var(--tx); font-size: 12px; }
    .summary-table td.right { text-align: right; }
    .summary-table tr.total-row td {
      border-top: 2px solid var(--ac);
      border-bottom: none;
      font-weight: 700;
      color: var(--a2);
    }
    .summary-table tr:hover td { background: rgba(22,119,255,0.06); }

    /* Bar chart */
    .bar-chart { margin-top: 20px; }
    .bar-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }
    .bar-name {
      font-size: 11px;
      color: var(--t2);
      width: 180px;
      flex-shrink: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .bar-track {
      flex: 1;
      height: 20px;
      background: var(--s2);
      border-radius: 4px;
      overflow: hidden;
      position: relative;
    }
    .bar-fill {
      height: 100%;
      border-radius: 4px;
      background: linear-gradient(90deg, var(--ac), var(--a2));
      transition: width 0.4s ease;
    }
    .bar-val {
      font-size: 11px;
      font-family: var(--mono);
      color: var(--a2);
      width: 120px;
      flex-shrink: 0;
      text-align: right;
    }

    /* Narrative cards */
    .narrative-card {
      background: var(--s2);
      border: 1px solid var(--bd);
      border-left: 3px solid var(--ac);
      border-radius: 6px;
      padding: 12px 16px;
      margin-bottom: 10px;
    }
    .narrative-uc-name {
      font-size: 11px;
      font-weight: 700;
      color: var(--a2);
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .narrative-text {
      font-size: 13px;
      color: var(--tx);
      line-height: 1.6;
    }

    /* ROI / TCO */
    .roi-section { margin-bottom: 20px; }
    .roi-label {
      font-size: 11px;
      font-weight: 700;
      color: var(--t2);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
    }
    .roi-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 8px;
    }
    .roi-field-label {
      flex: 1;
      font-size: 13px;
      color: var(--tx);
    }
    .roi-metric-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid var(--bd);
    }
    .roi-metric-label { font-size: 13px; color: var(--t2); }
    .roi-metric-value {
      font-size: 18px;
      font-weight: 700;
      font-family: var(--mono);
      color: var(--a2);
    }
    .roi-metric-value.green { color: var(--gr); }
    .roi-metric-value.yellow { color: var(--yl); }

    /* Waterfall */
    .waterfall {
      display: flex;
      gap: 0;
      align-items: flex-end;
      margin-top: 20px;
      padding: 20px;
      background: var(--s2);
      border-radius: 8px;
      border: 1px solid var(--bd);
      min-height: 180px;
    }
    .wf-bar-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    .wf-bar {
      width: 60px;
      border-radius: 4px 4px 0 0;
      min-height: 4px;
    }
    .wf-label {
      font-size: 10px;
      color: var(--t2);
      text-align: center;
      white-space: nowrap;
    }
    .wf-value {
      font-size: 11px;
      font-family: var(--mono);
      color: var(--tx);
      text-align: center;
    }

    /* Assumptions */
    .assumption-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid var(--bd);
    }
    .assumption-label {
      flex: 1;
      font-size: 13px;
      color: var(--tx);
    }
    .assumption-note {
      font-size: 11px;
      color: var(--t2);
      flex: 1;
    }

    /* Compare */
    .version-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      background: var(--s2);
      border: 1px solid var(--bd);
      border-radius: 6px;
      margin-bottom: 8px;
    }
    .version-name {
      flex: 1;
      font-size: 13px;
      font-weight: 600;
    }
    .version-ts {
      font-size: 11px;
      color: var(--t2);
    }
    .version-value {
      font-size: 12px;
      font-family: var(--mono);
      color: var(--a2);
    }
    .version-checkbox {
      accent-color: var(--ac);
    }
    .diff-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }
    .diff-table th {
      text-align: left;
      padding: 6px 12px;
      color: var(--t2);
      font-size: 11px;
      border-bottom: 1px solid var(--bd);
    }
    .diff-table td {
      padding: 6px 12px;
      border-bottom: 1px solid rgba(46,61,110,0.4);
      font-family: var(--mono);
    }
    .diff-table td.name { font-family: inherit; }
    .diff-up { color: var(--gr); }
    .diff-down { color: var(--rd); }

    /* Admin */
    .theme-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 20px;
    }
    .theme-swatch {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      padding: 6px;
      border: 2px solid transparent;
      border-radius: 6px;
      transition: border-color 0.15s;
    }
    .theme-swatch.active { border-color: var(--ac); }
    .theme-color-block {
      width: 48px;
      height: 32px;
      border-radius: 4px;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .theme-name {
      font-size: 10px;
      color: var(--t2);
    }
    .admin-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid var(--bd);
    }
    .admin-label {
      font-size: 13px;
      color: var(--tx);
    }
    .admin-sublabel {
      font-size: 11px;
      color: var(--t2);
      margin-top: 2px;
    }
    .toggle-switch {
      position: relative;
      width: 36px;
      height: 20px;
    }
    .toggle-switch input { opacity: 0; width: 0; height: 0; }
    .toggle-slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background: var(--s2);
      border: 1px solid var(--bd);
      border-radius: 20px;
      transition: 0.2s;
    }
    .toggle-slider:before {
      content: '';
      position: absolute;
      width: 14px;
      height: 14px;
      left: 2px;
      bottom: 2px;
      background: var(--t2);
      border-radius: 50%;
      transition: 0.2s;
    }
    .toggle-switch input:checked + .toggle-slider { background: var(--ac); border-color: var(--ac); }
    .toggle-switch input:checked + .toggle-slider:before { transform: translateX(16px); background: #fff; }

    /* Buttons */
    .btn {
      padding: 7px 16px;
      border-radius: 5px;
      border: 1px solid var(--bd);
      background: var(--s2);
      color: var(--tx);
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
      font-family: inherit;
      transition: all 0.15s;
    }
    .btn:hover { border-color: var(--ac); color: var(--ac); }
    .btn-primary {
      background: var(--ac);
      border-color: var(--ac);
      color: #fff;
    }
    .btn-primary:hover { background: var(--a2); border-color: var(--a2); color: #fff; }
    .btn-danger {
      border-color: var(--rd);
      color: var(--rd);
    }
    .btn-danger:hover { background: rgba(239,68,68,0.1); }
    .btn-sm { padding: 4px 10px; font-size: 11px; }

    /* Section headers */
    .section-header {
      font-size: 11px;
      font-weight: 700;
      color: var(--t2);
      text-transform: uppercase;
      letter-spacing: 0.7px;
      margin-bottom: 12px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--bd);
    }

    /* Grid */
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--t2);
      font-size: 13px;
    }

    /* Company input */
    input.company-input {
      width: 200px;
      padding: 5px 10px;
      border-radius: 5px;
      background: var(--s2);
      border: 1px solid var(--bd);
      color: var(--tx);
      font-size: 13px;
      font-family: inherit;
      outline: none;
    }
    input.company-input:focus { border-color: var(--ac); }

    /* Solutions multi-select */
    .sol-filter-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    /* Misc */
    .mt-8 { margin-top: 8px; }
    .mt-16 { margin-top: 16px; }
    .mt-20 { margin-top: 20px; }
    .mb-8 { margin-bottom: 8px; }
    .mb-16 { margin-bottom: 16px; }
    .flex { display: flex; }
    .items-center { align-items: center; }
    .gap-8 { gap: 8px; }
    .gap-12 { gap: 12px; }
    .flex-1 { flex: 1; }
    .text-right { text-align: right; }
    .font-mono { font-family: var(--mono); }
    .text-accent { color: var(--ac); }
    .text-green { color: var(--gr); }
    .text-muted { color: var(--t2); }
    .text-sm { font-size: 12px; }
    .text-xs { font-size: 11px; }
    .fw-600 { font-weight: 600; }
    .fw-700 { font-weight: 700; }
    .divider { height: 1px; background: var(--bd); margin: 16px 0; }
    .badge {
      display: inline-block;
      font-size: 10px;
      padding: 1px 6px;
      border-radius: 8px;
      font-weight: 600;
    }

    /* Print styles */
    @media print {
      body { background: white !important; color: black !important; }
      .no-print { display: none !important; }
      .tab-nav { display: none !important; }
      .header { position: static; background: white; color: black; border-bottom: 2px solid #ccc; }
      .tab-content { display: block !important; }
      .print-break { page-break-before: always; }
      .card, .uc-card { border: 1px solid #ccc; background: white; color: black; }
      input { background: #f5f5f5; color: black; border: 1px solid #ccc; }
    }
  </style>
</head>
<body>
  <div id="root">
    <div style="display:flex;align-items:center;justify-content:center;height:100vh;color:#8892b0;font-family:system-ui">Loading…</div>
  </div>

  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- App source — transpiled by Babel after data loads -->
  <script type="text/plain" id="app-source">
    const { useState, useEffect, useCallback, useMemo, useRef } = React;
    const { INDUSTRIES, SOLUTIONS, DEFAULT_MODEL, THEMES, LIB, fC, fN, fP, tyCalc, addTotals, generateNarrative } = window.__AVC__;

    const EMPTY_TOTALS = { y1l:0, y1h:0, y2l:0, y2h:0, y3l:0, y3h:0, tl:0, th:0 };
    const LS_KEY = 'avc_state_v1';

    function loadState() {
      try {
        const raw = localStorage.getItem(LS_KEY);
        if (raw) return JSON.parse(raw);
      } catch(e) {}
      return null;
    }

    function saveState(s) {
      try { localStorage.setItem(LS_KEY, JSON.stringify(s)); } catch(e) {}
    }

    // -------------------------------------------------------------------------
    // FieldInput
    // -------------------------------------------------------------------------
    function FieldInput({ field, value, onChange, locked, customerMode }) {
      const isLocked = locked && customerMode;
      const isPct = field.u === '%';
      const isCurrency = field.u === '$';
      const isAssumption = field.s === 'assumption';

      const displayVal = isPct ? parseFloat(((value ?? field.d) * 100).toFixed(4)).toString() : (value ?? field.d);

      function handleChange(e) {
        let v = parseFloat(e.target.value);
        if (isNaN(v)) v = 0;
        if (isPct) v = v / 100;
        onChange(v);
      }

      const labelNode = (
        <span className={`field-label ${isAssumption ? 'assumption-label' : ''}`}>
          {field.l}
          {isAssumption && field.n && (
            <span className="info-btn" style={{position:'relative',display:'inline-block'}}>
              ⓘ
              <span className="tooltip">{field.n}</span>
            </span>
          )}
        </span>
      );

      if (isLocked) {
        return (
          <div className="field-row">
            {labelNode}
            <span className="lock-icon">🔒</span>
            <span className="field-static">
              {isPct ? fP(value ?? field.d) : isCurrency ? fC(value ?? field.d) : fN(value ?? field.d)}
            </span>
            <span className="field-suffix">{isPct ? '' : field.u !== 'n' && field.u !== 'cust' && field.u !== 'FTEs' ? field.u : ''}</span>
          </div>
        );
      }

      return (
        <div className="field-row">
          {labelNode}
          <div className="field-input-wrap">
            {isCurrency && <span className="field-prefix">$</span>}
            <input
              type="number"
              value={displayVal}
              onChange={handleChange}
              step={isPct ? '0.1' : isCurrency ? '1000' : '1'}
            />
            {isPct && <span className="field-suffix">%</span>}
            {!isPct && field.u !== '$' && field.u !== 'n' && (
              <span className="field-suffix">{field.u}</span>
            )}
          </div>
        </div>
      );
    }

    // -------------------------------------------------------------------------
    // UseCaseCard
    // -------------------------------------------------------------------------
    function UseCaseCard({ uc, onChange, enabled, onToggle, aiEnabled, onAiToggle, model, customerMode, lockedFields, activeLens, company, inputs }) {
      const solMap = useMemo(() => {
        const m = {};
        SOLUTIONS.forEach(s => { m[s.id] = s; });
        return m;
      }, []);

      function getVal(k) {
        const key = `${uc.id}_${k}`;
        return inputs[key] !== undefined ? inputs[key] : undefined;
      }

      function getAllInputs() {
        const result = {};
        (uc.steps || []).forEach(step => {
          (step.fields || []).forEach(f => {
            result[f.k] = getVal(f.k) ?? f.d;
          });
        });
        if (uc.ai) {
          (uc.ai.fields || []).forEach(f => {
            result[f.k] = getVal(f.k) ?? f.d;
          });
        }
        return result;
      }

      const allInputs = getAllInputs();

      function computeSteps() {
        let prev = null;
        return (uc.steps || []).map(step => {
          let val = 0;
          try { val = step.fn(allInputs, prev); } catch(e) { val = 0; }
          if (!isFinite(val)) val = 0;
          prev = val;
          return { step, val, isFinal: step.fin === true };
        });
      }

      const steps = computeSteps();
      const finalStep = steps.find(s => s.isFinal);
      const baseAnnual = finalStep ? finalStep.val : 0;
      const npv = tyCalc(baseAnnual, model);

      let aiValue = 0;
      if (uc.ai && aiEnabled) {
        try {
          aiValue = uc.ai.fn(allInputs, baseAnnual);
          if (!isFinite(aiValue)) aiValue = 0;
        } catch(e) { aiValue = 0; }
      }
      const aiNpv = aiEnabled ? tyCalc(aiValue, model) : null;

      function catClass(cat) {
        if (!cat) return '';
        return cat.toLowerCase().replace(/[^a-z]/g, '-').replace(/--+/g, '-');
      }

      const lensVal = useMemo(() => {
        if (activeLens === 'outcomes') {
          if (uc.ops) { try { return fN(uc.ops.fn(allInputs)) + ' ' + (uc.ops.unit || ''); } catch(e) { return '—'; } }
          return '—';
        }
        if (activeLens === 'kpi') {
          if (uc.kpi) { try { return fP(uc.kpi.fn(allInputs)); } catch(e) { return '—'; } }
          return '—';
        }
        return null;
      }, [activeLens, allInputs]);

      return (
        <div className={`uc-card ${!enabled ? 'disabled' : ''}`}>
          <div className="uc-header" onClick={() => onToggle(uc.id)}>
            <input
              type="checkbox"
              className="uc-toggle"
              checked={!!enabled}
              onChange={e => { e.stopPropagation(); onToggle(uc.id); }}
              onClick={e => e.stopPropagation()}
            />
            <span className="uc-name">{uc.name}</span>
            {uc.cat && (
              <span className={`uc-cat ${catClass(uc.cat)}`}>{uc.cat}</span>
            )}
            {(uc.sol || []).map(sid => {
              const s = solMap[sid];
              if (!s) return null;
              return (
                <span key={sid} className="sol-chip" style={{background: s.color + '33', color: s.color, border: `1px solid ${s.color}55`}}>
                  {s.label.replace('Amplitude ', '').replace(' (AI)', '')}
                </span>
              );
            })}
            {enabled && activeLens !== 'financial' && (
              <span style={{marginLeft:'auto', fontSize:12, fontFamily:'var(--mono)', color:'var(--a2)', fontWeight:600}}>
                {lensVal}
              </span>
            )}
            {enabled && activeLens === 'financial' && (
              <span style={{marginLeft:'auto', fontSize:12, fontFamily:'var(--mono)', color:'var(--gr)', fontWeight:700}}>
                {fC(npv.tl)}–{fC(npv.th)}
              </span>
            )}
          </div>

          {enabled && (
            <div className="uc-body">
              {steps.map((s, i) => (
                <div key={s.step.id} className="step-block">
                  <div className="step-label">Step {i+1}: {s.step.label}</div>
                  {(s.step.fields || []).map(f => (
                    <FieldInput
                      key={f.k}
                      field={f}
                      value={getVal(f.k)}
                      onChange={v => onChange(uc.id, f.k, v)}
                      locked={lockedFields.has(`${uc.id}_${f.k}`)}
                      customerMode={customerMode}
                    />
                  ))}
                  {s.step.ft && (
                    <div className="step-formula">{s.step.ft}</div>
                  )}
                  <div className="step-result">
                    <span className="step-result-label">{s.step.rl}</span>
                    <span className={s.isFinal ? 'step-final-value' : 'step-result-value'}>
                      {s.step.ru === '$' ? fC(s.val) : s.step.ru === '%' ? fP(s.val) : fN(s.val)}
                      {s.step.ru === '$' && s.step.ru !== '$' ? '' : ''}
                    </span>
                  </div>
                  {s.isFinal && (
                    <div className="step-npv">
                      <div className="step-npv-label">3-Year NPV Range</div>
                      <div className="step-npv-value">{fC(npv.tl)} – {fC(npv.th)}</div>
                      <div style={{fontSize:11,color:'var(--t2)',marginTop:4,fontFamily:'var(--mono)'}}>
                        Y1: {fC(npv.y1l)}–{fC(npv.y1h)} &nbsp;|&nbsp;
                        Y2: {fC(npv.y2l)}–{fC(npv.y2h)} &nbsp;|&nbsp;
                        Y3: {fC(npv.y3l)}–{fC(npv.y3h)}
                      </div>
                    </div>
                  )}
                </div>
              ))}

              {uc.ai && (
                <div className="ai-section">
                  <div className="ai-toggle-row" onClick={() => onAiToggle(uc.id)}>
                    <input
                      type="checkbox"
                      checked={!!aiEnabled}
                      onChange={() => {}}
                      style={{accentColor:'var(--ac)'}}
                    />
                    <span className="ai-badge">AI</span>
                    <span className="ai-label">{uc.ai.label}</span>
                  </div>
                  {aiEnabled && (
                    <div style={{marginTop:10}}>
                      {(uc.ai.fields || []).map(f => (
                        <FieldInput
                          key={f.k}
                          field={f}
                          value={getVal(f.k)}
                          onChange={v => onChange(uc.id, f.k, v)}
                          locked={lockedFields.has(`${uc.id}_${f.k}`)}
                          customerMode={customerMode}
                        />
                      ))}
                      <div className="step-formula">{uc.ai.ft}</div>
                      <div className="ai-npv" style={{marginTop:8}}>
                        AI adds: {fC(aiNpv.tl)} – {fC(aiNpv.th)} over 3 years
                      </div>
                    </div>
                  )}
                </div>
              )}
            </div>
          )}
        </div>
      );
    }

    // -------------------------------------------------------------------------
    // Tab: Calculator
    // -------------------------------------------------------------------------
    function TabCalculator({ industry, setIndustry, company, setCompany, solFilter, setSolFilter, activeLens, setActiveLens, model, inputs, setInputs, enabled, setEnabled, aiEnabled, setAiEnabled, customerMode, lockedFields }) {
      const ucs = LIB[industry] || [];

      const filteredUcs = useMemo(() => {
        if (!solFilter || solFilter.length === 0) return ucs;
        return ucs.filter(uc =>
          (uc.sol || []).some(s => solFilter.includes(s))
        );
      }, [ucs, solFilter]);

      function toggleEnabled(ucId) {
        setEnabled(prev => ({ ...prev, [ucId]: !prev[ucId] }));
      }

      function toggleAiEnabled(ucId) {
        setAiEnabled(prev => ({ ...prev, [ucId]: !prev[ucId] }));
      }

      function handleFieldChange(ucId, key, val) {
        setInputs(prev => ({ ...prev, [`${ucId}_${key}`]: val }));
      }

      function toggleSolFilter(sid) {
        setSolFilter(prev =>
          prev.includes(sid) ? prev.filter(x => x !== sid) : [...prev, sid]
        );
      }

      return (
        <div>
          <div className="controls-row">
            <div className="controls-group">
              <div className="controls-label">Industry</div>
              <div className="pill-row" style={{marginBottom:0}}>
                {INDUSTRIES.map(ind => (
                  <button
                    key={ind.id}
                    className={`pill ${industry === ind.id ? 'active' : ''}`}
                    onClick={() => setIndustry(ind.id)}
                  >
                    {ind.label}
                  </button>
                ))}
              </div>
            </div>
            <div className="controls-group" style={{marginLeft:'auto'}}>
              <div className="controls-label">Company Name</div>
              <input
                type="text"
                className="company-input"
                placeholder="Enter company name…"
                value={company}
                onChange={e => setCompany(e.target.value)}
              />
            </div>
          </div>

          <div className="controls-row">
            <div className="controls-group flex-1">
              <div className="controls-label">Filter by Solution</div>
              <div className="sol-filter-wrap">
                {SOLUTIONS.map(s => (
                  <button
                    key={s.id}
                    className={`pill ${solFilter.includes(s.id) ? 'active' : ''}`}
                    style={solFilter.includes(s.id) ? {background: s.color, borderColor: s.color} : {}}
                    onClick={() => toggleSolFilter(s.id)}
                  >
                    {s.label}
                  </button>
                ))}
              </div>
            </div>
          </div>

          <div className="lens-row">
            {[['financial','$ Financial'], ['outcomes','# Outcomes'], ['kpi','% KPI']].map(([id, lbl]) => (
              <button
                key={id}
                className={`lens-btn ${activeLens === id ? 'active' : ''}`}
                onClick={() => setActiveLens(id)}
              >
                {lbl}
              </button>
            ))}
          </div>

          {filteredUcs.length === 0 && (
            <div className="empty-state">No use cases match the selected solution filters.</div>
          )}

          {filteredUcs.map(uc => (
            <UseCaseCard
              key={uc.id}
              uc={uc}
              inputs={inputs}
              onChange={handleFieldChange}
              enabled={!!enabled[uc.id]}
              onToggle={toggleEnabled}
              aiEnabled={!!aiEnabled[uc.id]}
              onAiToggle={toggleAiEnabled}
              model={model}
              customerMode={customerMode}
              lockedFields={lockedFields}
              activeLens={activeLens}
              company={company}
            />
          ))}
        </div>
      );
    }

    // -------------------------------------------------------------------------
    // Tab: Summary
    // -------------------------------------------------------------------------
    function TabSummary({ industry, model, inputs, enabled, aiEnabled, company }) {
      const ucs = LIB[industry] || [];
      const enabledUcs = ucs.filter(uc => enabled[uc.id]);

      function getUcInputs(uc) {
        const result = {};
        (uc.steps || []).forEach(step => {
          (step.fields || []).forEach(f => {
            const key = `${uc.id}_${f.k}`;
            result[f.k] = inputs[key] !== undefined ? inputs[key] : f.d;
          });
        });
        if (uc.ai) {
          (uc.ai.fields || []).forEach(f => {
            const key = `${uc.id}_${f.k}`;
            result[f.k] = inputs[key] !== undefined ? inputs[key] : f.d;
          });
        }
        return result;
      }

      function getBaseAnnual(uc, ucInputs) {
        let prev = null;
        let annual = 0;
        (uc.steps || []).forEach(step => {
          let val = 0;
          try { val = step.fn(ucInputs, prev); } catch(e) {}
          if (!isFinite(val)) val = 0;
          prev = val;
          if (step.fin) annual = val;
        });
        return annual;
      }

      const rows = useMemo(() => {
        return enabledUcs.map(uc => {
          const ucInputs = getUcInputs(uc);
          const annual = getBaseAnnual(uc, ucInputs);
          const npv = tyCalc(annual, model);

          let aiAnnual = 0;
          if (aiEnabled[uc.id] && uc.ai) {
            try { aiAnnual = uc.ai.fn(ucInputs, annual); } catch(e) {}
            if (!isFinite(aiAnnual)) aiAnnual = 0;
          }
          const aiNpv = tyCalc(aiAnnual, model);
          const combined = addTotals(npv, aiAnnual > 0 ? aiNpv : EMPTY_TOTALS);

          return { uc, ucInputs, annual, npv: combined };
        });
      }, [enabledUcs, inputs, model, aiEnabled]);

      const totals = useMemo(() => {
        return rows.reduce((acc, r) => addTotals(acc, r.npv), EMPTY_TOTALS);
      }, [rows]);

      const maxTh = useMemo(() => Math.max(...rows.map(r => r.npv.th), 1), [rows]);

      if (enabledUcs.length === 0) {
        return (
          <div className="empty-state">
            Enable use cases in the Calculator tab to see summary.
          </div>
        );
      }

      return (
        <div>
          <div className="card">
            <div className="section-header">3-Year Value Summary</div>
            <table className="summary-table">
              <thead>
                <tr>
                  <th>Use Case</th>
                  <th className="right">Y1 Low–High</th>
                  <th className="right">Y2 Low–High</th>
                  <th className="right">Y3 Low–High</th>
                  <th className="right">3-Yr Total Low–High</th>
                </tr>
              </thead>
              <tbody>
                {rows.map(r => (
                  <tr key={r.uc.id}>
                    <td className="name">{r.uc.name}</td>
                    <td className="right">{fC(r.npv.y1l)}–{fC(r.npv.y1h)}</td>
                    <td className="right">{fC(r.npv.y2l)}–{fC(r.npv.y2h)}</td>
                    <td className="right">{fC(r.npv.y3l)}–{fC(r.npv.y3h)}</td>
                    <td className="right">{fC(r.npv.tl)}–{fC(r.npv.th)}</td>
                  </tr>
                ))}
                <tr className="total-row">
                  <td className="name">Total</td>
                  <td className="right">{fC(totals.y1l)}–{fC(totals.y1h)}</td>
                  <td className="right">{fC(totals.y2l)}–{fC(totals.y2h)}</td>
                  <td className="right">{fC(totals.y3l)}–{fC(totals.y3h)}</td>
                  <td className="right">{fC(totals.tl)}–{fC(totals.th)}</td>
                </tr>
              </tbody>
            </table>
          </div>

          <div className="card">
            <div className="section-header">Value by Use Case (3-Yr High)</div>
            <div className="bar-chart">
              {rows.map(r => (
                <div key={r.uc.id} className="bar-row">
                  <span className="bar-name" title={r.uc.name}>{r.uc.name}</span>
                  <div className="bar-track">
                    <div
                      className="bar-fill"
                      style={{width: `${Math.max(2, (r.npv.th / maxTh) * 100)}%`}}
                    />
                  </div>
                  <span className="bar-val">{fC(r.npv.tl)}–{fC(r.npv.th)}</span>
                </div>
              ))}
            </div>
          </div>

          <div className="card">
            <div className="section-header">If/Then Narratives</div>
            {rows.map(r => {
              const narrative = generateNarrative(r.uc, r.ucInputs, r.annual, company);
              if (!narrative) return null;
              return (
                <div key={r.uc.id} className="narrative-card">
                  <div className="narrative-uc-name">{r.uc.name}</div>
                  <div className="narrative-text">{narrative}</div>
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    // -------------------------------------------------------------------------
    // Tab: ROI / TCO
    // -------------------------------------------------------------------------
    function TabROI({ industry, model, inputs, enabled, aiEnabled, investment, setInvestment }) {
      const ucs = LIB[industry] || [];
      const enabledUcs = ucs.filter(uc => enabled[uc.id]);

      function getUcInputs(uc) {
        const result = {};
        (uc.steps || []).forEach(step => {
          (step.fields || []).forEach(f => {
            const key = `${uc.id}_${f.k}`;
            result[f.k] = inputs[key] !== undefined ? inputs[key] : f.d;
          });
        });
        if (uc.ai) {
          (uc.ai.fields || []).forEach(f => {
            const key = `${uc.id}_${f.k}`;
            result[f.k] = inputs[key] !== undefined ? inputs[key] : f.d;
          });
        }
        return result;
      }

      const totals = useMemo(() => {
        return enabledUcs.reduce((acc, uc) => {
          const ucInputs = getUcInputs(uc);
          let prev = null;
          let annual = 0;
          (uc.steps || []).forEach(step => {
            let val = 0;
            try { val = step.fn(ucInputs, prev); } catch(e) {}
            if (!isFinite(val)) val = 0;
            prev = val;
            if (step.fin) annual = val;
          });
          let aiAnnual = 0;
          if (aiEnabled[uc.id] && uc.ai) {
            try { aiAnnual = uc.ai.fn(ucInputs, annual); } catch(e) {}
            if (!isFinite(aiAnnual)) aiAnnual = 0;
          }
          const npv = tyCalc(annual + aiAnnual, model);
          return addTotals(acc, npv);
        }, EMPTY_TOTALS);
      }, [enabledUcs, inputs, model, aiEnabled]);

      const totalInvestment = investment.platform + investment.impl + (investment.internal * 150);
      const roiLow = totalInvestment > 0 ? totals.tl / totalInvestment : 0;
      const roiHigh = totalInvestment > 0 ? totals.th / totalInvestment : 0;
      const netNpvLow = totals.tl - totalInvestment;
      const netNpvHigh = totals.th - totalInvestment;
      const paybackMonths = totals.y1h > 0 ? Math.round((totalInvestment / totals.y1h) * 12) : 0;

      const wfMax = Math.max(totalInvestment, totals.y1h, totals.y1h + totals.y2h, totals.th, 1);
      const wfBars = [
        { label: 'Investment', val: totalInvestment, color: 'var(--rd)' },
        { label: 'Y1 Value', val: totals.y1h, color: 'var(--ac)' },
        { label: 'Y2 Cumulative', val: totals.y1h + totals.y2h, color: 'var(--a2)' },
        { label: '3-Yr Total', val: totals.th, color: 'var(--gr)' },
      ];

      return (
        <div className="grid-2">
          <div>
            <div className="card">
              <div className="section-header">Amplitude Investment</div>
              <div className="roi-row">
                <span className="roi-field-label">Platform License</span>
                <div className="field-input-wrap">
                  <span className="field-prefix">$</span>
                  <input
                    type="number"
                    value={investment.platform}
                    onChange={e => setInvestment(p => ({...p, platform: parseFloat(e.target.value)||0}))}
                    step="10000"
                  />
                </div>
              </div>
              <div className="roi-row">
                <span className="roi-field-label">Implementation Services</span>
                <div className="field-input-wrap">
                  <span className="field-prefix">$</span>
                  <input
                    type="number"
                    value={investment.impl}
                    onChange={e => setInvestment(p => ({...p, impl: parseFloat(e.target.value)||0}))}
                    step="5000"
                  />
                </div>
              </div>
              <div className="roi-row">
                <span className="roi-field-label">Internal FTE Hours</span>
                <input
                  type="number"
                  value={investment.internal}
                  onChange={e => setInvestment(p => ({...p, internal: parseFloat(e.target.value)||0}))}
                  step="50"
                />
                <span className="text-muted text-sm">hrs × $150</span>
              </div>
              <div className="divider" />
              <div className="roi-row">
                <span className="roi-field-label fw-600">Total Investment</span>
                <span className="font-mono text-accent fw-700">{fC(totalInvestment)}</span>
              </div>
            </div>

            <div className="card">
              <div className="section-header">3-Year Value (from Calculator)</div>
              <div className="roi-row">

    // -------------------------------------------------------------------------
    // Tab: Compare
    // -------------------------------------------------------------------------
    function TabCompare({ snapState, versions, setVersions }) {
      const [selectedVersions, setSelectedVersions] = useState([]);
      const [snapshotName, setSnapshotName] = useState('');

      function saveSnapshot() {
        const name = snapshotName.trim() || `Snapshot ${versions.length + 1}`;
        const snap = {
          id: Date.now(),
          name,
          ts: new Date().toISOString(),
          state: snapState(),
        };
        setVersions(prev => [...prev, snap]);
        setSnapshotName('');
      }

      function deleteVersion(id) {
        setVersions(prev => prev.filter(v => v.id !== id));
        setSelectedVersions(prev => prev.filter(x => x !== id));
      }

      function toggleSelect(id) {
        setSelectedVersions(prev =>
          prev.includes(id)
            ? prev.filter(x => x !== id)
            : prev.length < 2 ? [...prev, id] : [prev[1], id]
        );
      }

      function getTotal(v) {
        const s = v.state;
        if (!s) return null;
        const industry = s.industry || 'retail';
        const ucs = LIB[industry] || [];
        const model = s.model || DEFAULT_MODEL;
        const inp = s.inputs || {};
        const en = s.enabled || {};
        const ai = s.aiEnabled || {};
        return ucs.filter(uc => en[uc.id]).reduce((acc, uc) => {
          let prev = null;
          let annual = 0;
          const ucInp = {};
          (uc.steps || []).forEach(step => {
            (step.fields || []).forEach(f => {
              const key = `${uc.id}_${f.k}`;
              ucInp[f.k] = inp[key] !== undefined ? inp[key] : f.d;
            });
          });
          if (uc.ai) {
            (uc.ai.fields || []).forEach(f => {
              const key = `${uc.id}_${f.k}`;
              ucInp[f.k] = inp[key] !== undefined ? inp[key] : f.d;
            });
          }
          (uc.steps || []).forEach(step => {
            let val = 0;
            try { val = step.fn(ucInp, prev); } catch(e) {}
            if (!isFinite(val)) val = 0;
            prev = val;
            if (step.fin) annual = val;
          });
          let aiAnnual = 0;
          if (ai[uc.id] && uc.ai) {
            try { aiAnnual = uc.ai.fn(ucInp, annual); } catch(e) {}
            if (!isFinite(aiAnnual)) aiAnnual = 0;
          }
          const npv = tyCalc(annual + aiAnnual, model);
          return addTotals(acc, npv);
        }, EMPTY_TOTALS);
      }

      const diffPairs = useMemo(() => {
        if (selectedVersions.length < 2) return null;
        const vA = versions.find(v => v.id === selectedVersions[0]);
        const vB = versions.find(v => v.id === selectedVersions[1]);
        if (!vA || !vB) return null;

        const sA = vA.state || {};
        const sB = vB.state || {};
        const industryA = sA.industry || 'retail';
        const industryB = sB.industry || 'retail';
        const ucsA = LIB[industryA] || [];
        const ucsB = LIB[industryB] || [];
        const allUcIds = [...new Set([...ucsA.map(u => u.id), ...ucsB.map(u => u.id)])];

        return { vA, vB, allUcIds, ucsA, ucsB, sA, sB };
      }, [selectedVersions, versions]);

      function getUcAnnual(uc, state) {
        if (!uc || !state) return 0;
        const inp = state.inputs || {};
        const ucInp = {};
        (uc.steps || []).forEach(step => {
          (step.fields || []).forEach(f => {
            ucInp[f.k] = inp[`${uc.id}_${f.k}`] !== undefined ? inp[`${uc.id}_${f.k}`] : f.d;
          });
        });
        let prev = null;
        let annual = 0;
        (uc.steps || []).forEach(step => {
          let val = 0;
          try { val = step.fn(ucInp, prev); } catch(e) {}
          if (!isFinite(val)) val = 0;
          prev = val;
          if (step.fin) annual = val;
        });
        return annual;
      }

      return (
        <div>
          <div className="card">
            <div className="section-header">Save Snapshot</div>
            <div style={{display:'flex',gap:10,alignItems:'center'}}>
              <input
                type="text"
                className="company-input"
                style={{width:260}}
                placeholder="Snapshot name (e.g. 'Base Case')"
                value={snapshotName}
                onChange={e => setSnapshotName(e.target.value)}
                onKeyDown={e => e.key === 'Enter' && saveSnapshot()}
              />
              <button className="btn btn-primary" onClick={saveSnapshot}>Save Current State</button>
            </div>
          </div>

          {versions.length === 0 && (
            <div className="empty-state">No snapshots saved yet. Save your first snapshot to start comparing.</div>
          )}

          {versions.length > 0 && (
            <div className="card">
              <div className="section-header">Saved Snapshots (select up to 2 to compare)</div>
              {versions.map(v => {
                const total = getTotal(v);
                const isSelected = selectedVersions.includes(v.id);
                return (
                  <div key={v.id} className={`version-item ${isSelected ? 'active' : ''}`}
                    style={isSelected ? {borderColor:'var(--ac)'} : {}}>
                    <input
                      type="checkbox"
                      className="version-checkbox"
                      checked={isSelected}
                      onChange={() => toggleSelect(v.id)}
                    />
                    <span className="version-name">{v.name}</span>
                    <span className="version-ts">{new Date(v.ts).toLocaleString()}</span>
                    {total && (
                      <span className="version-value">{fC(total.tl)}–{fC(total.th)}</span>
                    )}
                    <button className="btn btn-sm btn-danger" onClick={() => deleteVersion(v.id)}>Delete</button>
                  </div>
                );
              })}
            </div>
          )}

          {diffPairs && (
            <div className="card">
              <div className="section-header">
                Comparison: {diffPairs.vA.name} vs {diffPairs.vB.name}
              </div>
              <table className="diff-table">
                <thead>
                  <tr>
                    <th>Use Case</th>
                    <th>{diffPairs.vA.name} (Annual)</th>
                    <th>{diffPairs.vB.name} (Annual)</th>
                    <th>Change</th>
                  </tr>
                </thead>
                <tbody>
                  {diffPairs.allUcIds.map(uid => {
                    const ucA = diffPairs.ucsA.find(u => u.id === uid);
                    const ucB = diffPairs.ucsB.find(u => u.id === uid);
                    const enabledA = (diffPairs.sA.enabled || {})[uid];
                    const enabledB = (diffPairs.sB.enabled || {})[uid];
                    if (!enabledA && !enabledB) return null;
                    const annualA = ucA && enabledA ? getUcAnnual(ucA, diffPairs.sA) : 0;
                    const annualB = ucB && enabledB ? getUcAnnual(ucB, diffPairs.sB) : 0;
                    const delta = annualB - annualA;
                    const name = (ucA || ucB || {}).name || uid;
                    return (
                      <tr key={uid}>
                        <td className="name">{name}</td>
                        <td>{fC(annualA)}</td>
                        <td>{fC(annualB)}</td>
                        <td className={delta > 0 ? 'diff-up' : delta < 0 ? 'diff-down' : ''}>
                          {delta > 0 ? '+' : ''}{fC(delta)}
                        </td>
                      </tr>
                    );
                  }).filter(Boolean)}
                </tbody>
              </table>
            </div>
          )}
        </div>
      );
    }

    // -------------------------------------------------------------------------
    // Tab: Admin
    // -------------------------------------------------------------------------
    function TabAdmin({ theme, setTheme, customerMode, setCustomerMode, lockedFields, setLockedFields, industry, inputs, enabled, onReset, logoUrl, setLogoUrl }) {
      const ucs = LIB[industry] || [];
      const assumptionFields = useMemo(() => {
        const fields = [];
        ucs.forEach(uc => {
          (uc.steps || []).forEach(step => {
            (step.fields || []).forEach(f => {
              if (f.s === 'assumption') {
                fields.push({ ucId: uc.id, ucName: uc.name, field: f, key: `${uc.id}_${f.k}` });
              }
            });
          });
        });
        return fields;
      }, [ucs]);

      function toggleLock(key) {
        setLockedFields(prev => {
          const next = new Set(prev);
          if (next.has(key)) next.delete(key);
          else next.add(key);
          return next;
        });
      }

      const [confirmReset, setConfirmReset] = useState(false);

      return (
        <div>
          <div className="card">
            <div className="section-header">Theme</div>
            <div className="theme-grid">
              {Object.entries(THEMES).map(([tid, t]) => (
                <div
                  key={tid}
                  className={`theme-swatch ${theme === tid ? 'active' : ''}`}
                  onClick={() => setTheme(tid)}
                >
                  <div
                    className="theme-color-block"
                    style={{background: `linear-gradient(135deg, ${t.bg} 50%, ${t.accent} 100%)`}}
                  />
                  <span className="theme-name">{t.label}</span>
                </div>
              ))}
            </div>
          </div>

          <div className="card">
            <div className="section-header">Display Settings</div>
            <div className="admin-row">
              <div>
                <div className="admin-label">Customer Mode</div>
                <div className="admin-sublabel">Hide admin tab, lock assumption fields, show company branding</div>
              </div>
              <label className="toggle-switch">
                <input type="checkbox" checked={customerMode} onChange={e => setCustomerMode(e.target.checked)} />
                <span className="toggle-slider" />
              </label>
            </div>
            <div className="admin-row">
              <div>
                <div className="admin-label">Company Logo URL</div>
                <div className="admin-sublabel">Shown in header when customer mode is on</div>
              </div>
              <input
                type="text"
                className="company-input"
                style={{width:280}}
                placeholder="https://example.com/logo.png"
                value={logoUrl}
                onChange={e => setLogoUrl(e.target.value)}
              />
            </div>
          </div>

          {assumptionFields.length > 0 && (
            <div className="card">
              <div className="section-header">Lock / Unlock Assumption Fields</div>
              <p style={{fontSize:12,color:'var(--t2)',marginBottom:12}}>
                Locked fields display as read-only in customer mode.
              </p>
              <div style={{maxHeight:360,overflowY:'auto'}}>
                {assumptionFields.map(item => (
                  <div key={item.key} className="admin-row" style={{paddingLeft:0}}>
                    <div style={{flex:1}}>
                      <div className="admin-label" style={{fontSize:12}}>{item.field.l}</div>
                      <div className="admin-sublabel">{item.ucName}</div>
                    </div>
                    <label className="toggle-switch">
                      <input
                        type="checkbox"
                        checked={lockedFields.has(item.key)}
                        onChange={() => toggleLock(item.key)}
                      />
                      <span className="toggle-slider" />
                    </label>
                  </div>
                ))}
              </div>
            </div>
          )}

          <div className="card">
            <div className="section-header">Actions</div>
            <div style={{display:'flex',gap:12,flexWrap:'wrap'}}>
              <button className="btn" onClick={() => window.print()}>
                Print / Save as PDF
              </button>
              {!confirmReset ? (
                <button className="btn btn-danger" onClick={() => setConfirmReset(true)}>
                  Reset All Inputs
                </button>
              ) : (
                <div style={{display:'flex',gap:8,alignItems:'center'}}>
                  <span style={{fontSize:12,color:'var(--rd)'}}>Are you sure?</span>
                  <button className="btn btn-danger" onClick={() => { onReset(); setConfirmReset(false); }}>
                    Yes, Reset
                  </button>
                  <button className="btn" onClick={() => setConfirmReset(false)}>Cancel</button>
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    // -------------------------------------------------------------------------
    // App root
    // -------------------------------------------------------------------------
    function App() {
      const saved = loadState();

      const [industry, setIndustry] = useState(saved?.industry || 'retail');
      const [activeTab, setActiveTab] = useState(saved?.activeTab || 'calculator');
      const [company, setCompany] = useState(saved?.company || '');
      const [theme, setTheme] = useState(saved?.theme || 'amplitude');
      const [model, setModel] = useState(saved?.model || {...DEFAULT_MODEL});
      const [inputs, setInputs] = useState(saved?.inputs || {});
      const [enabled, setEnabled] = useState(() => {
        if (saved?.enabled) return saved.enabled;
        const init = {};
        (LIB[saved?.industry || 'retail'] || []).forEach(uc => { init[uc.id] = true; });
        return init;
      });
      const [aiEnabled, setAiEnabled] = useState(saved?.aiEnabled || {});
      const [customerMode, setCustomerMode] = useState(saved?.customerMode || false);
      const [lockedFields, setLockedFields] = useState(() => new Set(saved?.lockedFields || []));
      const [versions, setVersions] = useState(saved?.versions || []);
      const [investment, setInvestment] = useState(saved?.investment || { platform: 150000, impl: 50000, internal: 30000 });
      const [activeLens, setActiveLens] = useState(saved?.activeLens || 'financial');
      const [solFilter, setSolFilter] = useState(saved?.solFilter || []);
      const [logoUrl, setLogoUrl] = useState(saved?.logoUrl || '');

      // When industry changes, enable all use cases that aren't already tracked
      useEffect(() => {
        setEnabled(prev => {
          const next = {...prev};
          (LIB[industry] || []).forEach(uc => {
            if (!(uc.id in next)) next[uc.id] = true;
          });
          return next;
        });
      }, [industry]);

      // Apply theme CSS variables
      useEffect(() => {
        const t = THEMES[theme] || THEMES.amplitude;
        const root = document.documentElement;
        root.style.setProperty('--bg', t.bg);
        root.style.setProperty('--sf', t.sf);
        root.style.setProperty('--s2', t.s2);
        root.style.setProperty('--bd', t.bd);
        root.style.setProperty('--ac', t.accent);
        root.style.setProperty('--a2', t.accent2);
        if (t.light) {
          root.style.setProperty('--tx', '#1a202c');
          root.style.setProperty('--t2', '#4a5568');
        } else {
          root.style.setProperty('--tx', '#e8eaf6');
          root.style.setProperty('--t2', '#8892b0');
        }
        document.body.style.background = t.bg;
        document.body.style.color = t.light ? '#1a202c' : '#e8eaf6';
      }, [theme]);

      // Persist state
      useEffect(() => {
        saveState({
          industry, activeTab, company, theme, model, inputs,
          enabled, aiEnabled, customerMode,
          lockedFields: [...lockedFields],
          versions, investment, activeLens, solFilter, logoUrl,
        });
      }, [industry, activeTab, company, theme, model, inputs, enabled, aiEnabled, customerMode, lockedFields, versions, investment, activeLens, solFilter, logoUrl]);

      function resetAll() {
        setInputs({});
        const init = {};
        (LIB[industry] || []).forEach(uc => { init[uc.id] = true; });
        setEnabled(init);
        setAiEnabled({});
        setModel({...DEFAULT_MODEL});
        setInvestment({ platform: 150000, impl: 50000, internal: 30000 });
        setLockedFields(new Set());
      }

      function snapState() {
        return { industry, company, model, inputs, enabled, aiEnabled, investment };
      }

      const tabs = [
        { id: 'calculator', label: 'Calculator' },
        { id: 'summary', label: 'Summary' },
        { id: 'roi', label: 'ROI / TCO' },
        { id: 'assumptions', label: 'Assumptions' },
        { id: 'compare', label: 'Compare' },
        ...(!customerMode ? [{ id: 'admin', label: 'Admin ⚙' }] : []),
      ];

      const currentTheme = THEMES[theme] || THEMES.amplitude;

      return (
        <div>
          <header className="header">
            {customerMode && logoUrl ? (
              <img src={logoUrl} alt="Logo" className="header-logo-img" />
            ) : (
              <span className="header-logo">Amplitude</span>
            )}
            <span className="header-divider" />
            <span className="header-subtitle">Value Calculator</span>
            {company && <span className="header-company">{company}</span>}
          </header>

          <nav className="tab-nav no-print">
            {tabs.map(tab => (
              <button
                key={tab.id}
                className={`tab-btn ${activeTab === tab.id ? 'active' : ''}`}
                onClick={() => setActiveTab(tab.id)}
              >
                {tab.label}
              </button>
            ))}
          </nav>

          <main className="main">
            <div className={`tab-content ${activeTab === 'calculator' ? 'active' : ''}`}>
              <TabCalculator
                industry={industry}
                setIndustry={setIndustry}
                company={company}
                setCompany={setCompany}
                solFilter={solFilter}
                setSolFilter={setSolFilter}
                activeLens={activeLens}
                setActiveLens={setActiveLens}
                model={model}
                inputs={inputs}
                setInputs={setInputs}
                enabled={enabled}
                setEnabled={setEnabled}
                aiEnabled={aiEnabled}
                setAiEnabled={setAiEnabled}
                customerMode={customerMode}
                lockedFields={lockedFields}
              />
            </div>

            <div className={`tab-content ${activeTab === 'summary' ? 'active' : ''}`}>
              <TabSummary
                industry={industry}
                model={model}
                inputs={inputs}
                enabled={enabled}
                aiEnabled={aiEnabled}
                company={company}
              />
            </div>

            <div className={`tab-content ${activeTab === 'roi' ? 'active' : ''}`}>
              <TabROI
                industry={industry}
                model={model}
                inputs={inputs}
                enabled={enabled}
                aiEnabled={aiEnabled}
                investment={investment}
                setInvestment={setInvestment}
              />
            </div>

            <div className={`tab-content ${activeTab === 'assumptions' ? 'active' : ''}`}>
              <TabAssumptions model={model} setModel={setModel} />
            </div>

            <div className={`tab-content ${activeTab === 'compare' ? 'active' : ''}`}>
              <TabCompare
                snapState={snapState}
                versions={versions}
                setVersions={setVersions}
              />
            </div>

            {!customerMode && (
              <div className={`tab-content ${activeTab === 'admin' ? 'active' : ''}`}>
                <TabAdmin
                  theme={theme}
                  setTheme={setTheme}
                  customerMode={customerMode}
                  setCustomerMode={setCustomerMode}
                  lockedFields={lockedFields}
                  setLockedFields={setLockedFields}
                  industry={industry}
                  inputs={inputs}
                  enabled={enabled}
                  onReset={resetAll}
                  logoUrl={logoUrl}
                  setLogoUrl={setLogoUrl}
                />
              </div>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>

  <!-- Data loader: imports data.js, transpiles app source, renders -->
